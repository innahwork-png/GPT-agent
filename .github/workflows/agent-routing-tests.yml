name: Agent routing tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e '.[test]' supabase
      - name: Run routing and API tests
        env:
          OPENAI_MODEL: auto
        run: python -m pytest tests/test_projects.py -q
